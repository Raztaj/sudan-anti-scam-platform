<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASP - Submit a Report</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-base-100">
        <div class="navbar-start">
            <div class="dropdown">
                <label tabindex="0" class="btn btn-ghost lg:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </label>
                <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                    <li><a href="index.html" data-i18n="home"></a></li>
                    <li><a href="report.html" data-i18n="submitReport"></a></li>
                    <li><a href="browse.html" data-i18n="browseReports"></a></li>
                    <li><a href="verified.html" data-i18n="verifiedList"></a></li>
                </ul>
            </div>
            <a href="index.html" class="btn btn-ghost normal-case text-xl">SASP</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
                <li><a href="index.html" data-i18n="home"></a></li>
                <li><a href="report.html" data-i18n="submitReport"></a></li>
                <li><a href="browse.html" data-i18n="browseReports"></a></li>
                <li><a href="verified.html" data-i18n="verifiedList"></a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <button id="lang-switcher" class="btn btn-ghost" data-i18n="langSwitcher"></button>
            <div id="auth-button-container"></div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <div class="text-center my-8">
            <h1 class="text-4xl font-bold" data-i18n="submitReportTitle"></h1>
            <p class="mt-2" data-i18n="submitReportSubtitle"></p>
        </div>

        <div class="card max-w-2xl mx-auto">
            <form id="report-form" class="space-y-6">
                <p id="form-message" class="text-center text-lg"></p>

                <!-- Step 1: Identifier -->
                <div id="form-step-1" class="form-step">
                    <div class="form-control">
                        <label class="label"><span class="label-text" data-i18n="formReportType"></span></label>
                        <select id="report-type" class="select select-bordered w-full">
                            <option data-i18n="typePhoneNumber"></option>
                            <option data-i18n="typeEmail"></option>
                            <option data-i18n="typeSocialMedia"></option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text" data-i18n="formIdentifier"></span></label>
                        <input type="text" id="identifier" class="input input-bordered w-full" required />
                    </div>
                </div>

                <!-- Step 2: Details -->
                <div id="form-step-2" class="form-step" style="display: none;">
                    <div class="form-control">
                        <label class="label"><span class="label-text" data-i18n="formDescription"></span></label>
                        <textarea id="description" class="textarea textarea-bordered w-full h-28" required></textarea>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text" data-i18n="formCategory"></span></label>
                        <select id="category" class="select select-bordered w-full">
                            <option data-i18n="categoryFinancial"></option>
                            <option data-i18n="categoryImpersonation"></option>
                        </select>
                    </div>
                </div>

                <!-- Navigation -->
                <div class="flex justify-between mt-8">
                    <button type="button" id="prev-btn" class="btn" style="display: none;" data-i18n="prevButton">Previous</button>
                    <button type="button" id="next-btn" class="btn btn-primary" data-i18n="nextButton">Next</button>
                    <button type="submit" id="submit-btn" class="btn btn-primary" style="display: none;" data-i18n="formSubmitBtn">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer footer-center p-4 bg-base-300 text-base-content mt-12">
        <div>
            <p>Copyright © 2024 - All right reserved by SASP</p>
            <a href="mailto:feedback@sasp.org" class="link link-hover">Provide Feedback</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
