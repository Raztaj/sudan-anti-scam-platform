<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Scam - SASP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-background text-foreground">
    <div id="root">
        <div class="min-h-screen bg-background">
            <nav class="bg-white shadow-md">
                <div class="container mx-auto px-4">
                    <div class="flex justify-between items-center py-4">
                        <a href="/" class="text-2xl font-bold text-SASP-primary">SASP</a>
                        <div class="hidden md:flex items-center space-x-4">
                            <a href="index.html" class="nav-link" data-key="nav_home">Home</a>
                            <a href="report.html" class="nav-link" data-key="nav_report">Report Scam</a>
                            <a href="search.html" class="nav-link" data-key="nav_search">Search Database</a>
                            <a href="verified.html" class="nav-link" data-key="nav_verified">Verified Profiles</a>
                            <a href="check-message.html" class="nav-link" data-key="nav_check">Check Message</a>
                        </div>
                        <div class="flex items-center">
                            <button id="language-switcher" class="btn btn-primary" style="padding: 0.5rem 1rem;">العربية</button>
                        </div>
                    </div>
                </div>
            </nav>
            <div class="container mx-auto px-4 py-12">
                <div class="max-w-2xl mx-auto">
                    <div class="flex justify-center mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield h-16 w-16 text-SASP-primary"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </div>

                    <div class="border-SASP-primary border-t-4 rounded-lg shadow-md bg-white">
                        <div class="text-center p-6">
                            <h1 class="text-2xl font-bold" data-key="report_scam_title">Report Scam</h1>
                            <p class="text-muted-foreground" data-key="report_scam_desc">Help others by reporting scam attempts you've encountered</p>
                        </div>
                        <div class="p-6">
                            <form id="report-scam-form" class="space-y-6">
                                <div>
                                    <label for="identifierType" class="block text-sm font-medium text-gray-700" data-key="what_reporting">What are you reporting?</label>
                                    <select id="identifierType" name="identifierType" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-SASP-primary focus:border-SASP-primary sm:text-sm rounded-md">
                                        <option data-key="select_type">Select type</option>
                                        <option value="phone" data-key="phone_number">Phone Number</option>
                                        <option value="email" data-key="email">Email</option>
                                        <option value="social" data-key="social_media">Social Media</option>
                                    </select>
                                </div>

                                <div>
                                    <label for="identifier" class="block text-sm font-medium text-gray-700" data-key="identifier">Identifier</label>
                                    <input type="text" name="identifier" id="identifier" class="mt-1 focus:ring-SASP-primary focus:border-SASP-primary block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                                </div>

                                <div>
                                    <label for="scamType" class="block text-sm font-medium text-gray-700" data-key="scam_type">Scam Type</label>
                                    <select id="scamType" name="scamType" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-SASP-primary focus:border-SASP-primary sm:text-sm rounded-md">
                                        <option data-key="select_scam_type">Select scam type</option>
                                        <option value="financial" data-key="financial">Financial</option>
                                        <option value="impersonation" data-key="impersonation">Impersonation</option>
                                        <option value="jobOffer" data-key="job_offer">Job Offer</option>
                                        <option value="phishing" data-key="phishing">Phishing</option>
                                        <option value="other" data-key="other">Other</option>
                                    </select>
                                </div>

                                <div>
                                    <label for="description" class="block text-sm font-medium text-gray-700" data-key="description">Description</label>
                                    <textarea id="description" name="description" rows="4" class="mt-1 shadow-sm focus:ring-SASP-primary focus:border-SASP-primary mt-1 block w-full sm:text-sm border border-gray-300 rounded-md" placeholder="Please describe the scam attempt in detail..."></textarea>
                                </div>

                                <div class="flex justify-center">
                                    <button type="submit" class="btn btn-primary" data-key="submit">
                                        Submit
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
