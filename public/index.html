<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASP - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body id="page-index">
    <nav class="navbar bg-base-100">
        <div class="navbar-start">
            <div class="dropdown">
                <label tabindex="0" class="btn btn-ghost lg:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </label>
                <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                    <li><a href="index.html" data-i18n="home"></a></li>
                    <li><a href="report.html" data-i18n="submitReport"></a></li>
                    <li><a href="browse.html" data-i18n="browseReports"></a></li>
                    <li><a href="verified.html" data-i18n="verifiedList"></a></li>
                </ul>
            </div>
            <a href="index.html" class="btn btn-ghost normal-case text-xl">SASP</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
                <li><a href="index.html" data-i18n="home"></a></li>
                <li><a href="report.html" data-i18n="submitReport"></a></li>
                <li><a href="browse.html" data-i18n="browseReports"></a></li>
                <li><a href="verified.html" data-i18n="verifiedList"></a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <button id="lang-switcher" class="btn btn-ghost" data-i18n="langSwitcher"></button>
            <div id="auth-button-container"></div>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-content text-center">
            <div>
                <h1 class="text-5xl font-bold" data-i18n="heroTitle"></h1>
                <p class="py-6" data-i18n="heroSubtitle"></p>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-4 -mt-16">
        <!-- Stats Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12">
            <div class="stat-card">
                <h3 data-i18n="statsTotalReportsValue">1,234</h3>
                <p data-i18n="statsTotalReports"></p>
            </div>
            <div class="stat-card">
                <h3 data-i18n="statsVerifiedCompaniesValue">56</h3>
                <p data-i18n="statsVerifiedCompanies"></p>
            </div>
            <div class="stat-card">
                <h3 data-i18n="statsCommonScamValue">Impersonation</h3>
                <p data-i18n="statsCommonScam"></p>
            </div>
        </div>

        <!-- Actions: Search & Analyzer -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Search Section -->
            <div class="card">
                <h2 class="text-2xl font-bold mb-4" data-i18n="searchTitle"></h2>
                <div class="form-control">
                    <input type="text" id="search-identifier" placeholder="Enter phone, email, or URL..." class="input input-bordered w-full" />
                    <button id="search-btn" class="btn btn-primary mt-3" data-i18n="searchButton"></button>
                </div>
                <div id="search-result" class="mt-4"></div>
            </div>
            <!-- Scam Analyzer Section -->
            <div class="card">
                <h2 class="text-2xl font-bold mb-4" data-i18n="analyzerTitle"></h2>
                <div class="form-control">
                    <textarea id="analyzer-text" class="textarea textarea-bordered w-full h-32" placeholder="Paste a suspicious message here..."></textarea>
                    <button id="analyze-btn" class="btn btn-primary mt-3" data-i18n="analyzeButton"></button>
                </div>
                <p id="analyzer-result" class="mt-4 text-center"></p>
            </div>
        </div>
    </div>

    <footer class="footer footer-center p-4 bg-base-300 text-base-content mt-12">
        <div>
            <p>Copyright © 2024 - All right reserved by SASP</p>
            <a href="mailto:feedback@sasp.org" class="link link-hover">Provide Feedback</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
