<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Analysis - SASP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <a href="/" class="text-2xl font-bold text-SASP-primary">SASP</a>
                <div class="md:hidden">
                    <button id="hamburger-menu" class="text-gray-600 hover:text-gray-800 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                </div>
                <div id="nav-links" class="hidden md:flex items-center space-x-4">
                    <a href="index.html" class="nav-link" data-key="nav_home">Home</a>
                    <a href="report.html" class="nav-link" data-key="nav_report">Report Scam</a>
                    <a href="search.html" class="nav-link" data-key="nav_search">Search Database</a>
                    <a href="verified.html" class="nav-link" data-key="nav_verified">Verified Profiles</a>
                    <a href="smart-analysis.html" class="nav-link active" data-key="nav_smart_analysis">Smart Analysis</a>
                </div>
                <div class="flex items-center">
                    <button id="language-switcher" class="btn btn-primary">العربية</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto text-center">
            <h1 class="text-4xl font-bold mb-4" data-key="smart_analysis_title">Smart Analysis Engine (Demo Version)</h1>
            <p class="text-lg text-gray-600 mb-8" data-key="smart_analysis_desc">
                Does this message feel strange? Paste it here and let our AI engine reveal hidden scam patterns.
            </p>

            <div class="bg-white p-8 rounded-lg shadow-md">
                <form id="smart-analysis-form" action="smart-analysis-results.html" method="GET">
                    <textarea
                        name="message"
                        class="w-full p-4 border rounded-md h-40 focus:ring-2 focus:ring-SASP-primary focus:outline-none"
                        data-key="smart_analysis_placeholder"
                        placeholder="Paste the suspicious message here..."></textarea>
                    <button
                        type="button"
                        id="analyze-button"
                        class="btn btn-primary w-full mt-4"
                        data-key="smart_analysis_button">
                        Analyze Message
                    </button>
                </form>
                <div id="error-message" class="text-red-500 mt-4 text-center" style="display: none;"></div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
