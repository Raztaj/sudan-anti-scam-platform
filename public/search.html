<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Database - SASP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-background text-foreground">
    <div id="root">
        <div class="min-h-screen bg-background">
            <nav class="bg-white shadow-md">
                <div class="container mx-auto px-4">
                    <div class="flex justify-between items-center py-4">
                        <a href="/" class="text-2xl font-bold text-SASP-primary">SASP</a>
                        <div class="hidden md:flex items-center space-x-4">
                            <a href="index.html" class="nav-link" data-key="nav_home">Home</a>
                            <a href="report.html" class="nav-link" data-key="nav_report">Report Scam</a>
                            <a href="search.html" class="nav-link" data-key="nav_search">Search Database</a>
                            <a href="verified.html" class="nav-link" data-key="nav_verified">Verified Profiles</a>
                            <a href="check-message.html" class="nav-link" data-key="nav_check">Check Message</a>
                        </div>
                        <div class="flex items-center">
                            <button id="language-switcher" class="bg-SASP-primary text-white px-4 py-2 rounded-md">العربية</button>
                        </div>
                    </div>
                </div>
            </nav>
            <div class="container mx-auto px-4 py-12">
                <div class="max-w-4xl mx-auto">
                    <div class="text-center mb-10">
                        <h1 class="text-3xl font-bold mb-4" data-key="search_db_title">Search Database</h1>
                        <p class="text-muted-foreground" data-key="search_db_desc">
                            Check if a phone number, email, or social media account has been reported before
                        </p>
                    </div>

                    <div class="mb-8">
                        <form id="search-database-form" class="flex flex-col sm:flex-row gap-3">
                            <div class="flex-grow">
                                <input placeholder="Enter phone, email, or social media account" class="w-full px-4 py-2 border rounded-md" data-key="search_placeholder">
                            </div>
                            <button type="submit" class="bg-SASP-primary hover:bg-SASP-secondary text-white px-6 py-2 rounded-md flex items-center justify-center gap-2" data-key="search">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search w-4 h-4"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                Search
                            </button>
                        </form>
                    </div>

                    <div id="search-results">
                        <h2 class="text-xl font-semibold mb-4" data-key="search_results">Search Results</h2>

                        <div class="border rounded-lg shadow-md bg-white p-6 text-center">
                            <p class="text-muted-foreground" data-key="no_results">
                                No results found for the given query.
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
